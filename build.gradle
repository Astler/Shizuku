plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

// Our own release numbering; upstream base kept for reference in the name.
def upstreamVersionName = "13.7.0"
def forkVersionName = providers.gradleProperty("FORK_VERSION_NAME").get()
def isBeta = project.hasProperty("beta")
ext {
    versionCode = Integer.parseInt(providers.gradleProperty("FORK_VERSION_CODE").get())
    versionName = "${forkVersionName}${if (isBeta) "-beta" else ""} (${upstreamVersionName})"
}

// One identity for the manager, starter, server and generated UI resources.
ext.FORK_APP_NAME = providers.gradleProperty("FORK_APP_NAME").get()
ext.FORK_APPLICATION_ID = providers.gradleProperty("FORK_APPLICATION_ID").get()
ext.FORK_PERMISSION_PREFIX = "${FORK_APPLICATION_ID}.permission"
