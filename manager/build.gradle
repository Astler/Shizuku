tasks.named("preBuild").configure { dependsOn(forkNotices) }

android.applicationVariants.configureEach { variant ->
    variant.registerGeneratedResFolders(files(forkResources.map { it.destinationDir }).builtBy(forkResources))
    def variantName = variant.name
    def capitalizedVariant = variantName.capitalize()
    def buildTypeName = variant.buildType.name
    def distributionSuffix = variant.flavorName == "play" ? "-play" : ""
    tasks.named("pre${capitalizedVariant}Build").configure {
        dependsOn(":shell:assemble${buildTypeName.capitalize()}")
    }
    if (variant.buildType.minifyEnabled) {
        def optimizeTask = tasks.named("optimize${capitalizedVariant}Resources")
        def collapseResources = tasks.register("collapse${capitalizedVariant}ResourceNames") {
            // Consume AGP's declared output instead of hardcoding variant-specific paths.
            inputs.files(optimizeTask.map { it.outputs.files })
            doLast {
                def resourceArchive = optimizeTask.get().outputs.files.asFileTree.matching {
                    include "**/*.ap_"
                }.singleFile
                def optimized = new File("${resourceArchive}.opt")
                def aapt2 = Paths.get(android.sdkDirectory.path, "build-tools", android.buildToolsVersion, "aapt2")
                services.get(ExecOperations).exec {
                    commandLine aapt2.toFile(), "optimize", "--collapse-resource-names",
                        "--resources-config-path", "aapt2-resources.cfg",
                        "-o", optimized, resourceArchive
                }
                java.nio.file.Files.move(optimized.toPath(), resourceArchive.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        optimizeTask.configure { finalizedBy(collapseResources) }
    }
    variant.outputs.configureEach {
        outputFileName = "${rootProject.ext.FORK_APPLICATION_ID}-v${providers.gradleProperty("FORK_VERSION_NAME").get()}${distributionSuffix}-${buildTypeName}.apk"

        variant.assembleProvider.get().doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath

            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingDir
                    rename { String fileName -> "mapping-${variant.flavorName}-${variant.versionName}.txt" }
                }
                copy {
                    from outputFile
                    into apkDir
                }
            }
        }
    }
}

